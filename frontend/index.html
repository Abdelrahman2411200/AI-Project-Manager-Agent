<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fc" />
    <meta
      name="description"
      content="AI Project Manager — structured planning, execution, and project intelligence."
    />
    <title>AI Project Manager</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("aipm-theme");
          var preference = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var resolved = preference === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : preference;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = resolved;
          document.querySelector('meta[name="theme-color"]').setAttribute(
            "content",
            resolved === "dark" ? "#0c1220" : "#f5f7fc"
          );
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
