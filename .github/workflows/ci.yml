name: continuous-verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend-quality:
    name: 1 · Backend lint and type
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - working-directory: backend
        run: uv sync --locked --group dev
      - working-directory: backend
        run: uv run ruff format --check app tests
      - working-directory: backend
        run: uv run ruff check app tests
      - working-directory: backend
        run: uv run mypy app

  backend-tests:
    name: 2 · Backend and PostgreSQL
    needs: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - working-directory: backend
        run: uv sync --locked --group dev
      - name: Install Chromium for isolated PDF verification
        working-directory: backend
        run: uv run playwright install --with-deps chromium
      - name: Run backend acceptance suite
        working-directory: backend
        env:
          TEST_POSTGRES_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: >
          uv run pytest
          --cov=app
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=85
          --junitxml=pytest.xml
      - name: Run live PostgreSQL reference load gate
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
          ALEMBIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
          CORS_ORIGINS: '["http://127.0.0.1:8000"]'
          SESSION_HASH_SECRET: ci-load-test-session-secret-32-characters
        run: |
          uv run alembic upgrade head
          uv run python -m tests.performance.reference_api_load \
            --base-url http://127.0.0.1:8000 \
            --concurrency 50 \
            --serve |
            tee reference-load.json
      - name: Retain safe backend reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            backend/coverage.xml
            backend/pytest.xml
            backend/reference-load.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: 3 · Frontend tests and build
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run test:run -- --coverage.enabled=false
      - working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: 4 · Browser acceptance
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e
      - name: Retain failure traces only
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-traces
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: 5 · Security scans
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit locked Python dependencies
        working-directory: backend
        run: |
          uv export --locked --group dev --format requirements-txt --no-hashes --output-file audit-requirements.txt
          uvx --python 3.12 pip-audit --requirement audit-requirements.txt
      - name: Scan Python source
        working-directory: backend
        run: uvx --python 3.12 bandit -r app -ll
      - name: Audit locked frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm run audit:ci
      - name: Scan repository history for secrets
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source=/repo --no-banner --redact=100 --exit-code=1

  restore-drill:
    name: 6 · Encrypted restore drill
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: project_manager
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d project_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - working-directory: backend
        run: uv sync --locked --group dev
      - name: Migrate source database
        working-directory: backend
        env:
          ALEMBIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/project_manager
        run: uv run alembic upgrade head
      - name: Backup, restore, and verify
        run: |
          docker build --file infra/backup/Dockerfile --tag aipm-restore-verifier .
          docker run --rm --network host \
            --env ADMIN_DATABASE_URL=postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres \
            --env DATABASE_URL=postgresql+psycopg://postgres:postgres@127.0.0.1:5432/project_manager \
            --env RESTORE_DATABASE_URL=postgresql+psycopg://postgres:postgres@127.0.0.1:5432/project_manager_restore_check \
            --env BACKUP_PASSPHRASE=ci-restore-drill-only-not-a-production-secret \
            aipm-restore-verifier |
            tee "${{ runner.temp }}/restore-verification.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-verification
          path: ${{ runner.temp }}/restore-verification.json
          if-no-files-found: error
          retention-days: 30

  release-gate:
    name: 7 · Full-version verification gate
    needs: restore-drill
    runs-on: ubuntu-latest
    steps:
      - run: echo "All ordered full-version verification gates passed."
