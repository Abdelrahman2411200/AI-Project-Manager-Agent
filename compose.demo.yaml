name: ai-project-manager-university-demo

x-demo-environment: &demo-environment
  APP_ENV: demo
  APP_VERSION: ${APP_VERSION:-0.13.0}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://project_manager_demo:demo-database-only@db:5432/project_manager_demo}
  SESSION_HASH_SECRET: ${SESSION_HASH_SECRET:-university-demo-session-secret-32-characters}
  COOKIE_SECURE: "false"
  CORS_ORIGINS: '["${DEMO_ORIGIN:-http://localhost:${HTTP_PORT:-8080}}"]'
  AI_PROVIDER: ${AI_PROVIDER:-ollama}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-1800}
  OLLAMA_CONTEXT_TOKENS: ${OLLAMA_CONTEXT_TOKENS:-8192}
  OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-4096}
  OLLAMA_FAST_PLANNING: ${OLLAMA_FAST_PLANNING:-true}
  PLANNING_RUN_DEFAULT_TOKEN_BUDGET: ${PLANNING_RUN_DEFAULT_TOKEN_BUDGET:-100000}
  MODEL_INPUT_PRICE_PER_MILLION: ${MODEL_INPUT_PRICE_PER_MILLION:-0}
  MODEL_CACHED_INPUT_PRICE_PER_MILLION: ${MODEL_CACHED_INPUT_PRICE_PER_MILLION:-0}
  MODEL_OUTPUT_PRICE_PER_MILLION: ${MODEL_OUTPUT_PRICE_PER_MILLION:-0}
  USER_DAILY_RUN_LIMIT: ${USER_DAILY_RUN_LIMIT:-100}
  USER_DAILY_TOKEN_BUDGET: ${USER_DAILY_TOKEN_BUDGET:-2000000}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_manager_demo}
      POSTGRES_USER: ${POSTGRES_USER:-project_manager_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-database-only}
    volumes:
      - demo_postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: ai-project-manager-backend:${APP_VERSION:-0.13.0}
    build:
      context: ./backend
      target: base
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment: *demo-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    image: ai-project-manager-backend:${APP_VERSION:-0.13.0}
    profiles: ["reset"]
    build:
      context: ./backend
      target: base
    command:
      - /app/.venv/bin/python
      - -m
      - app.cli.demo_reset
      - --confirm
      - RESET-DEMO-DATA
    environment:
      <<: *demo-environment
      DEMO_OWNER_PASSWORD: ${DEMO_OWNER_PASSWORD:-SyntheticDemoOnly!2026}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: ai-project-manager-backend:${APP_VERSION:-0.13.0}
    build:
      context: ./backend
      target: base
    environment: *demo-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose: ["8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=2)
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  worker:
    image: ai-project-manager-backend:${APP_VERSION:-0.13.0}
    build:
      context: ./backend
      target: base
    command: ["/app/.venv/bin/python", "-m", "app.workers.main"]
    environment: *demo-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: ${DEMO_WORKER_REPLICAS:-4}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  demo_postgres:
