name: ai-project-manager-production

x-backend-environment: &backend-environment
  APP_ENV: production
  APP_VERSION: ${APP_VERSION:-0.13.0}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  SESSION_HASH_SECRET: ${SESSION_HASH_SECRET:?SESSION_HASH_SECRET is required}
  COOKIE_SECURE: "true"
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  AI_PROVIDER: ${AI_PROVIDER:-none}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  db:
    profiles: ["production"]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - production_postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: ai-project-manager-backend:${APP_VERSION:-0.13.0}
    profiles: ["production"]
    build:
      context: ./backend
      target: base
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ai-project-manager-backend:${APP_VERSION:-0.13.0}
    profiles: ["production"]
    build:
      context: ./backend
      target: base
    environment: *backend-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose: ["8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  worker:
    image: ai-project-manager-backend:${APP_VERSION:-0.13.0}
    profiles: ["production"]
    build:
      context: ./backend
      target: base
    command: ["/app/.venv/bin/python", "-m", "app.workers.main"]
    environment: *backend-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - from app.db.session import check_database_connection; raise SystemExit(0 if check_database_connection() else 1)
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    profiles: ["production"]
    build:
      context: ./frontend
      target: production
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backup:
    profiles: ["operations"]
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    entrypoint: ["sh", "infra/backup/backup.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?BACKUP_PASSPHRASE is required}
      BACKUP_DIR: /backups
    volumes:
      - production_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  production_postgres:
  production_backups:
