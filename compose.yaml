name: ai-project-manager

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: project_manager
      POSTGRES_USER: project_manager
      POSTGRES_PASSWORD: project_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U project_manager -d project_manager
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ai-project-manager-backend:${APP_VERSION:-0.13.0}-development
    build:
      context: ./backend
      target: development
    command:
      - uv
      - run
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://project_manager:project_manager@db:5432/project_manager
      CORS_ORIGINS: '["http://localhost:5173"]'
      SESSION_HASH_SECRET: development-compose-session-secret-change-me
      COOKIE_SECURE: "false"
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-600}
      OLLAMA_CONTEXT_TOKENS: ${OLLAMA_CONTEXT_TOKENS:-8192}
      OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-4096}
      PDF_RENDER_TIMEOUT_SECONDS: ${PDF_RENDER_TIMEOUT_SECONDS:-60}
      PDF_MAX_BYTES: ${PDF_MAX_BYTES:-10485760}
      PDF_MAX_CONCURRENCY: ${PDF_MAX_CONCURRENCY:-2}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    image: ai-project-manager-backend:${APP_VERSION:-0.13.0}-development
    build:
      context: ./backend
      target: development
    command:
      - uv
      - run
      - python
      - -m
      - app.workers.main
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://project_manager:project_manager@db:5432/project_manager
      SESSION_HASH_SECRET: development-compose-session-secret-change-me
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-600}
      OLLAMA_CONTEXT_TOKENS: ${OLLAMA_CONTEXT_TOKENS:-8192}
      OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-4096}
      PLANNING_RUN_DEFAULT_TOKEN_BUDGET: ${PLANNING_RUN_DEFAULT_TOKEN_BUDGET:-50000}
      JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-15}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-90}
      JOB_POLL_SECONDS: ${JOB_POLL_SECONDS:-1}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    image: ai-project-manager-backend:${APP_VERSION:-0.13.0}-development
    build:
      context: ./backend
      target: development
    command:
      - uv
      - run
      - alembic
      - upgrade
      - head
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://project_manager:project_manager@db:5432/project_manager
      SESSION_HASH_SECRET: development-compose-session-secret-change-me
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  backend_venv:
  frontend_node_modules:
